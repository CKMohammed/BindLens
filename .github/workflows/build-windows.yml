# Builds "BindLens Setup.exe" on a Windows computer of GitHub. Every push to main publishes it as the Release of
# its version (v1.0, v1.1...: Releases > latest) - a new push of the same version replaces the installer there.
name: Build Windows installer

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "web/**"]   # the website (docs/) and the web app's source (web/) need no new installer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGN: ${{ secrets.SIGN_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pymupdf tkinterdnd2 python-vlc

      - name: Read the version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path BindLens.pyw -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Output "BindLens $v"

      - name: Build BindLens.exe
        run: >
          python -m PyInstaller --noconfirm --windowed --name BindLens --icon BindLens.ico
          --collect-all tkinterdnd2 --collect-all pymupdf --hidden-import vlc BindLens.pyw

      - name: Add the files that go with it (licence, source code, guides, licence texts)
        shell: pwsh
        run: |
          Copy-Item LICENSE.txt, NOTICE.txt, PRIVACY.txt, README.txt, BindLens.pyw, bookreader.py, BindLens.ico -Destination dist\BindLens\
          Copy-Item Welcome -Destination dist\BindLens\Welcome -Recurse
          $lic = New-Item -ItemType Directory dist\BindLens\licenses -Force
          Copy-Item "$env:pythonLocation\LICENSE.txt" "$lic\Python-LICENSE.txt" -ErrorAction SilentlyContinue
          $tcl = Get-ChildItem "$env:pythonLocation\tcl" -Recurse -Filter license.terms -ErrorAction SilentlyContinue
          foreach ($f in $tcl) { Copy-Item $f.FullName "$lic\$($f.Directory.Name)-license.terms" }
          Get-ChildItem $lic

      - name: Add the VLC engine (plays the videos inside BindLens)
        shell: pwsh
        run: |
          $vlc = "$env:ProgramFiles\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { choco install vlc -y --no-progress | Out-Null }
          if (-not (Test-Path "$vlc\libvlc.dll")) {
            Invoke-WebRequest "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.zip" -OutFile vlc.zip
            Expand-Archive vlc.zip -DestinationPath vlcz
            $vlc = (Get-ChildItem vlcz -Directory)[0].FullName
          }
          $dst = New-Item -ItemType Directory dist\BindLens\vlc -Force
          Copy-Item "$vlc\libvlc.dll", "$vlc\libvlccore.dll" $dst
          Copy-Item "$vlc\plugins" "$dst\plugins" -Recurse
          foreach ($d in "gui", "lua", "visualization", "video_splitter", "services_discovery", "stream_out",
                         "keystore", "control") {
            Remove-Item "$dst\plugins\$d" -Recurse -Force -ErrorAction SilentlyContinue
          }
          Copy-Item "$vlc\COPYING.txt" "$dst\COPYING.txt" -ErrorAction SilentlyContinue
          if (Test-Path "$vlc\vlc-cache-gen.exe") { & "$vlc\vlc-cache-gen.exe" "$dst\plugins" }
          "{0:N1} MB" -f ((Get-ChildItem $dst -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Self-test (PyMuPDF, drag and drop, helper process, a video played by VLC)
        shell: pwsh
        run: |
          $out = Join-Path $pwd "selftest.txt"
          $mp4 = Join-Path $pwd "tests\sample.mp4"
          $p = Start-Process -FilePath "dist\BindLens\BindLens.exe" -ArgumentList "--selftest", "`"$out`"", "`"$mp4`"" -Wait -PassThru
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "self-test failed" }

      - name: Sign the program (only when a code-signing certificate is set up)
        if: env.HAS_SIGN == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASS: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f sign.pfx /p $env:SIGN_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\BindLens\BindLens.exe

      - name: Make the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVer=${{ steps.ver.outputs.version }}" installer\BindLens.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem Output

      - name: Build BookReader by BindLens (only reading - the same program as BookReader.exe)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --windowed --name BookReader --icon BookReader.ico --hidden-import bookreader --collect-all tkinterdnd2 --collect-all pymupdf BindLens.pyw
          Copy-Item LICENSE.txt, NOTICE.txt, PRIVACY.txt, README.txt, BindLens.pyw, bookreader.py, BookReader.ico -Destination dist\BookReader\
          Set-Content -Path dist\BookReader\bookreader.mode -Value "BookReader by BindLens: only reading, its own library (%APPDATA%\BookReader)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVer=${{ steps.ver.outputs.version }}" installer\BookReader.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (BookReader)" }
          Get-ChildItem Output

      - name: Sign the installer (only when a code-signing certificate is set up)
        if: env.HAS_SIGN == 'true'
        env:
          SIGN_PFX: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PASS: ${{ secrets.SIGN_PFX_PASSWORD }}
        shell: pwsh
        run: |
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $st.FullName sign /f sign.pfx /p $env:SIGN_PASS /fd sha256 /tr http://timestamp.digicert.com /td sha256 "Output\BindLens Setup.exe"

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: BindLens-Setup-${{ steps.ver.outputs.version }}
          path: Output/BindLens Setup.exe

      - name: Publish the release of this version
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BindLens ${{ steps.ver.outputs.version }}
          make_latest: true
          files: |
            Output/BindLens Setup.exe
            Output/BookReader Setup.exe
          body: |
            **Download `BindLens.Setup.exe` below and run it.** No administrator rights and no Python needed.

            Windows may say "Windows protected your PC" (the installer is not signed yet): click
            **More info** > **Run anyway**.

            Your books, marks and settings stay where they are (%APPDATA%\BindLens).

            BindLens is free software under the GNU AGPL v3. Its source code is in this repository and
            inside the program's folder (BindLens.pyw).
